allprojects {
    apply plugin: 'java'
    apply plugin: "xyz.wagyourtail.unimined"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }

    def vers = ""
    try {
        vers = 'git describe --always --tags --first-parent --dirty'.execute().text.trim()
    } catch (Exception e) {
        println "Version detection failed: " + e
    }
    if (!vers.startsWith("v")) {
        println "using version number: " + rootProject.mod_version
        version = rootProject.mod_version
    } else {
        version = vers.substring(1)
        println "Detected version " + version
    }
    group = rootProject.maven_group

    java {
        sourceCompatibility = JavaVersion.toVersion(project.java_version)
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(sourceCompatibility.majorVersion.toInteger()))
        }
    }

    repositories {
        maven {
            url = "https://files.minecraftforge.net/maven/"
        }
        maven {
            name = 'spongepowered-repo'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'fabric-maven'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'impactdevelopment-repo'
            url = 'https://impactdevelopment.github.io/maven/'
        }
        maven {
            name = "ldtteam"
            url = "https://maven.parchmentmc.net/"
        }
        // for the newer version of launchwrapper
        maven {
            name = "multimc-maven"
            url = "https://files.multimc.org/maven/"
            metadataSources {
                artifact()
            }
        }
        mavenCentral()
        maven {
            name = 'babbaj-repo'
            url = 'https://babbaj.github.io/maven/'
        }
    }

    dependencies {
        compileOnly "org.spongepowered:mixin:${project.mixin_version}"
        compileOnly "org.ow2.asm:asm:${project.asm_version}"

        implementation "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"

        implementation 'com.google.code.findbugs:jsr305:3.0.2'
    }

    unimined.minecraft(sourceSets.main, true) {
        version rootProject.minecraft_version

        mappings {
            if (rootProject.use_intermediary.toBoolean()) {
                intermediary()
            }
            mojmap()
            if (!rootProject.parchment_version.isEmpty()) {
                parchment(rootProject.minecraft_version, rootProject.parchment_version)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"

        def targetVersion = project.java_version.toInteger()
        if (JavaVersion.current().isJava9Compatible()) {
            it.options.release = targetVersion
        }
    }

    tasks.named('test') {
        maxHeapSize = '3g'
    }
}

unimined.minecraft {
    runs.off = true
    defaultRemapJar = false
}

base {
    archivesName = archivesName.get() + "-common"
}

sourceSets {
    api {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
    main {
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
    test {
        compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    }
    launch {
        compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    }
    schematica_api {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
    main {
        compileClasspath += schematica_api.output
        runtimeClasspath += schematica_api.output
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

jar {
    from sourceSets.main.output, sourceSets.launch.output, sourceSets.api.output
}

javadoc {
    options.addStringOption('Xwerror', '-quiet') // makes the build fail on travis when there is a javadoc error
    options.linkSource true
    options.encoding "UTF-8" // allow emoji in comments :^)
    source = sourceSets.api.allJava
    classpath += sourceSets.api.compileClasspath
}

// Ostinato: the Rust library (native/, see docs/RUST_NATIVE.md). Packaged as resources at natives/ostinato/<os>-<arch>/:
// prebuilt libraries from -Postinato_natives_dir=<dir> (laid out <dir>/<os>-<arch>/<lib>, how CI ships all six), else
// the host's own, built with cargo when cargo is installed. Without either the jar has no natives and runs the Java code.
def nativesOut = layout.buildDirectory.dir("generated/natives").get().asFile

static String ostinatoPlatform() {
    def os = System.getProperty("os.name", "").toLowerCase(Locale.ROOT)
    def arch = System.getProperty("os.arch", "").toLowerCase(Locale.ROOT)
    def o = os.startsWith("windows") ? "windows" : (os.contains("mac") || os.contains("darwin")) ? "macos" : os.contains("linux") ? "linux" : null
    def a = (arch == "amd64" || arch == "x86_64") ? "x86_64" : (arch == "aarch64" || arch == "arm64") ? "aarch64" : null
    return o == null || a == null ? null : o + "-" + a
}

static String ostinatoLibName(String platform) {
    return platform.startsWith("windows") ? "ostinato_native.dll" : platform.startsWith("macos") ? "libostinato_native.dylib" : "libostinato_native.so"
}

tasks.register("nativeHost") {
    description = "Puts the ostinato-native libraries under build/generated/natives (prebuilt, or built with cargo)."
    outputs.dir(nativesOut)
    outputs.upToDateWhen { false } // cargo decides what is stale
    def prebuilt = project.findProperty("ostinato_natives_dir")
    def crate = file("native")
    doLast {
        def dest = new File(nativesOut, "natives/ostinato")
        project.delete(nativesOut)
        dest.mkdirs()
        if (prebuilt) {
            def dir = file(prebuilt)
            def found = []
            dir.eachDir { d ->
                def lib = new File(d, ostinatoLibName(d.name))
                if (lib.isFile()) {
                    project.copy { from lib; into new File(dest, d.name) }
                    found << d.name
                }
            }
            if (found.isEmpty()) {
                throw new GradleException("ostinato_natives_dir=" + dir + " holds no <os>-<arch>/<lib> folders")
            }
            println "ostinato-native: packaging prebuilt " + found.sort().join(", ")
            return
        }
        def platform = ostinatoPlatform()
        if (platform == null) {
            println "ostinato-native: no native build for this platform; the jar runs the Java code"
            return
        }
        def home = System.getProperty("user.home")
        def exe = System.getProperty("os.name").toLowerCase(Locale.ROOT).startsWith("windows") ? "cargo.exe" : "cargo"
        def cargo = [System.getenv("CARGO"), home + "/.cargo/bin/" + exe].find { it != null && new File(it).isFile() } ?: "cargo"
        def out
        try {
            def proc = new ProcessBuilder(cargo, "build", "--release", "--manifest-path", new File(crate, "Cargo.toml").absolutePath)
                    .redirectErrorStream(true).start()
            out = proc.inputStream.text
            if (proc.waitFor() != 0) {
                println out
                println "ostinato-native: cargo build failed; the jar runs the Java code"
                return
            }
        } catch (IOException e) {
            println "ostinato-native: cargo not found; the jar runs the Java code"
            return
        }
        project.copy { from new File(crate, "target/release/" + ostinatoLibName(platform)); into new File(dest, platform) }
        println "ostinato-native: built " + platform
    }
}

sourceSets.main.resources.srcDir(nativesOut)
tasks.named("processResources") { dependsOn "nativeHost" }

test {
    // -Postinato_native_require: fail the parity tests instead of skipping them when the library does not load
    systemProperty "ostinato.native.require", project.hasProperty("ostinato_native_require")
    systemProperty "ostinato.bench", project.hasProperty("ostinato_bench")
    // Ostinato: spectate truth replay (TruthReplayTest)
    if (project.hasProperty("ostinato_truth")) { systemProperty "ostinato.truth", project.property("ostinato_truth"); systemProperty "ostinato.truth.every", project.findProperty("ostinato_truth_every") ?: "1"; systemProperty "ostinato.truth.prevYaw", project.hasProperty("ostinato_truth_prevyaw") }
    jvmArgs "--enable-native-access=ALL-UNNAMED" // the game prints the one-line FFM warning; tests need not
    testLogging { showStandardStreams = project.hasProperty("ostinato_bench") }
}
