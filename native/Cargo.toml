[package]
name = "ostinato-native"
version = "1.0.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Native (Rust) twins of Ostinato's hottest searches, called from Java through the FFM API"
publish = false

[lib]
name = "ostinato_native"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind" # every export catches panics; unwinding must stay on so it can
debug = false
strip = true
