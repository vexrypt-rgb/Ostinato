name: Build per version

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.21.4"
            java: "21"
          - version: "1.21.11"
            java: "21"
          - version: "26.3"
            java: "25"
    name: Minecraft ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.java == '25' && 'zulu' || 'temurin' }}
          cache: gradle
      - name: Apply version overlay
        run: bash scripts/use-version.sh ${{ matrix.version }}
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build -Pmod_version="$(git describe --always --tags --first-parent | cut -c2-)"
      - name: Test
        run: ./gradlew test
      - uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.version }}
          path: dist/
