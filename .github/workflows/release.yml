name: Release

# Builds the Fabric jars of every Minecraft version Ostinato supports (one branch each) and publishes them as one
# GitHub release. Runs on a `v*` tag pushed to main, or by hand with a tag name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0); created on main if missing'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build MC ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { mc: '1.16.1', ref: '1.16.1', java: '8', cmd: './gradlew build -Pbaritone.fabric_build' }
          - { mc: '1.21.4', ref: '1.21.4', java: '21', cmd: './gradlew :fabric:build -Pavailable_loaders=fabric' }
          - { mc: '1.21.11', ref: 'main', java: '21', cmd: './gradlew :fabric:build -Pavailable_loaders=fabric' }
          - { mc: '26.3', ref: '26.3', java: '25', cmd: './gradlew :fabric:build -Pavailable_loaders=fabric' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: Build (tests included)
        run: |
          chmod +x gradlew
          ${{ matrix.cmd }}
      - name: Collect jars
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in dist/baritone-*-fabric-*.jar; do
            case "$f" in *ostinato*) continue ;; esac # 1.16.1 keeps a committed copy for TenorClef
            base="$(basename "$f" .jar)"
            cp -v "$f" "out/ostinato-mc${{ matrix.mc }}-${base#baritone-}.jar"
          done
          ls out/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: out/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Ostinato ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: jars/*.jar
          fail_on_unmatched_files: true
